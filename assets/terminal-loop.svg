<svg width="680" height="296" viewBox="0 0 680 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">Animated Vim session</title>
  <desc id="termDesc">Typing vim FOCUS.md, then inserting focus areas line by line in insert mode</desc>

  <defs>
    <radialGradient id="tbg" cx="40%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="680" height="296" rx="14"/>
    </clipPath>

    <clipPath id="chromeClip">
      <rect x="0" y="0" width="680" height="36"/>
    </clipPath>

    <style>
      <![CDATA[
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .bright { fill: #f0f0f0; }
      .fg     { fill: #c8c8c8; }
      .muted  { fill: #888888; }
      .dim    { fill: #555555; }

      .frame {
        fill: url(#tbg);
        stroke: none;
      }

      /* —— Ambient: status dots —— */
      .dot {
        fill: #3a3a3a;
        animation: dotPulse 2.4s ease-in-out infinite;
      }
      .dot-a { animation-delay: 0s; }
      .dot-b { animation-delay: 0.35s; }
      .dot-c { animation-delay: 0.7s; }
      @keyframes dotPulse {
        0%, 100% { fill: #3a3a3a; opacity: 0.65; }
        50%      { fill: #6a6a6a; opacity: 1; }
      }

      /* —— Ambient: hairline shimmer —— */
      .hairline {
        stroke: #2e2e2e;
        stroke-width: 1;
        animation: hairlineGlow 4s ease-in-out infinite;
      }
      @keyframes hairlineGlow {
        0%, 100% { stroke: #222222; opacity: 0.7; }
        50%      { stroke: #444444; opacity: 1; }
      }

      /* —— Ambient: title-bar activity shimmer —— */
      .bar-shimmer {
        pointer-events: none;
        animation: barShimmer 5.5s ease-in-out infinite;
      }
      @keyframes barShimmer {
        0%   { transform: translateX(-220px); opacity: 0; }
        12%  { opacity: 0.55; }
        50%  { opacity: 0.35; }
        88%  { opacity: 0.55; }
        100% { transform: translateX(680px); opacity: 0; }
      }

      /* —— Prompt $ pulse —— */
      .prompt {
        fill: #f0f0f0;
        animation: promptPulse 2.2s ease-in-out infinite;
      }
      @keyframes promptPulse {
        0%, 100% { opacity: 0.75; }
        50%      { opacity: 1; }
      }

      /*
        Master cycle: 18s — typing @ ~250 WPM (≈20.8 chars/s),
        with the slower post-command pause / phase timing from before.
        glyph ≈ 10.25px at 17px mono
        vim FOCUS.md          12 chars → 0.58s
        line1                 53 chars → 2.55s
        line2                 55 chars → 2.65s
        line3                 51 chars → 2.45s
      */
      .boot {
        animation: bootIn 18s linear infinite;
      }
      @keyframes bootIn {
        0%   { opacity: 0; transform: translateY(6px); }
        1.4% { opacity: 1; transform: translateY(0); }
        94%  { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-2px); }
      }

      /* Prompt phase visible, then yields to editor */
      .prompt-phase {
        animation: promptPhase 18s linear infinite;
      }
      @keyframes promptPhase {
        0%, 8%      { opacity: 1; }
        9.5%, 100%  { opacity: 0; }
      }

      .editor-phase {
        opacity: 0;
        animation: editorPhase 18s linear infinite;
      }
      @keyframes editorPhase {
        0%, 8.5%   { opacity: 0; }
        9.6%, 94%  { opacity: 1; }
        100%       { opacity: 0; }
      }

      /* —— Command typewriter —— */
      .cmd-text {
        clip-path: inset(0 100% 0 0);
        animation: cmdReveal 18s infinite;
      }
      @keyframes cmdReveal {
        0%, 1.8% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(1, end);
        }
        1.9% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(12, end);
        }
        5.1%, 8% {
          clip-path: inset(0 0% 0 0);
          animation-timing-function: linear;
        }
        9.5%, 100% {
          clip-path: inset(0 100% 0 0);
        }
      }

      .cmd-cursor {
        fill: #f0f0f0;
        animation: cmdCursor 18s infinite;
      }
      @keyframes cmdCursor {
        0%, 1.8% {
          opacity: 0;
          transform: translateX(0);
          animation-timing-function: steps(1, end);
        }
        1.9% {
          opacity: 1;
          transform: translateX(0);
          animation-timing-function: steps(12, end);
        }
        5.1% {
          opacity: 1;
          transform: translateX(123px);
          animation-timing-function: ease-out;
        }
        8% {
          opacity: 0;
          transform: translateX(123px);
        }
        100% {
          opacity: 0;
          transform: translateX(123px);
        }
      }

      /* —— Editor line typewriters —— */
      .line-text {
        clip-path: inset(0 100% 0 0);
      }

      .l1-text {
        animation: l1Reveal 18s infinite;
      }
      @keyframes l1Reveal {
        0%, 9.5% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(1, end);
        }
        9.6% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(53, end);
        }
        23.8%, 94% {
          clip-path: inset(0 0% 0 0);
        }
        100% {
          clip-path: inset(0 100% 0 0);
        }
      }

      .l2-text {
        animation: l2Reveal 18s infinite;
      }
      @keyframes l2Reveal {
        0%, 26.6% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(1, end);
        }
        26.7% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(55, end);
        }
        41.4%, 94% {
          clip-path: inset(0 0% 0 0);
        }
        100% {
          clip-path: inset(0 100% 0 0);
        }
      }

      .l3-text {
        animation: l3Reveal 18s infinite;
      }
      @keyframes l3Reveal {
        0%, 44.3% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(1, end);
        }
        44.4% {
          clip-path: inset(0 100% 0 0);
          animation-timing-function: steps(51, end);
        }
        58.0%, 94% {
          clip-path: inset(0 0% 0 0);
        }
        100% {
          clip-path: inset(0 100% 0 0);
        }
      }

      /*
        Edit caret: types each line, pauses, then jumps down two rows
        (Enter, Enter → blank line between sentences).
        Row pitch = 28px; content rows at +0 / +56 / +112.
      */
      .edit-cursor {
        fill: #f0f0f0;
        opacity: 0;
        animation: editCursor 18s infinite;
      }
      @keyframes editCursor {
        0%, 9.5% {
          opacity: 0;
          transform: translate(0, 0);
          animation-timing-function: steps(1, end);
        }
        9.6% {
          opacity: 1;
          transform: translate(0, 0);
          animation-timing-function: steps(53, end);
        }
        23.8% {
          opacity: 1;
          transform: translate(543.25px, 0);
          animation-timing-function: linear;
        }
        24.7% {
          opacity: 1;
          transform: translate(543.25px, 0);
          animation-timing-function: steps(1, end);
        }
        25.5% {
          opacity: 1;
          transform: translate(0, 28px);
          animation-timing-function: steps(1, end);
        }
        26.6% {
          opacity: 1;
          transform: translate(0, 56px);
          animation-timing-function: steps(55, end);
        }
        41.4% {
          opacity: 1;
          transform: translate(563.75px, 56px);
          animation-timing-function: linear;
        }
        42.3% {
          opacity: 1;
          transform: translate(563.75px, 56px);
          animation-timing-function: steps(1, end);
        }
        43.1% {
          opacity: 1;
          transform: translate(0, 84px);
          animation-timing-function: steps(1, end);
        }
        44.3% {
          opacity: 1;
          transform: translate(0, 112px);
          animation-timing-function: steps(51, end);
        }
        58.0% {
          opacity: 1;
          transform: translate(522.75px, 112px);
          animation-timing-function: ease-out;
        }
        92% {
          opacity: 1;
          transform: translate(522.75px, 112px);
        }
        94%, 100% {
          opacity: 0;
          transform: translate(522.75px, 112px);
        }
      }

      .gutter-rule {
        stroke: #2a2a2a;
        stroke-width: 1;
      }

      .status-bar {
        fill: #121212;
      }

      @media (prefers-reduced-motion: reduce) {
        .dot,
        .hairline,
        .bar-shimmer,
        .prompt,
        .boot,
        .prompt-phase,
        .editor-phase,
        .cmd-text,
        .cmd-cursor,
        .l1-text,
        .l2-text,
        .l3-text,
        .edit-cursor {
          animation: none !important;
        }
        .boot { opacity: 1; transform: none; }
        .prompt { opacity: 1; }
        .prompt-phase { opacity: 0; }
        .editor-phase { opacity: 1; }
        .cmd-text,
        .l1-text,
        .l2-text,
        .l3-text { clip-path: none; }
        .cmd-cursor,
        .edit-cursor { opacity: 0; }
        .bar-shimmer { display: none; }
        .dot { opacity: 0.85; fill: #4a4a4a; }
      }
      ]]>
    </style>
  </defs>

  <!-- Frame -->
  <rect class="frame" x="0" y="0" width="680" height="296" rx="14"/>

  <g clip-path="url(#frameClip)">
    <!-- Chrome / title bar -->
    <g id="chrome">
      <rect x="0" y="0" width="680" height="36" fill="url(#barGrad)"/>
      <g clip-path="url(#chromeClip)">
        <rect class="bar-shimmer" x="0" y="0" width="200" height="36" fill="url(#shimmerGrad)"/>
      </g>
      <g transform="translate(18, 18)">
        <circle class="dot dot-a" cx="0"  cy="0" r="5.5"/>
        <circle class="dot dot-b" cx="20" cy="0" r="5.5"/>
        <circle class="dot dot-c" cx="40" cy="0" r="5.5"/>
      </g>
      <text class="mono muted editor-phase" font-size="12" x="340" y="22" text-anchor="middle">vim — FOCUS.md</text>
      <line class="hairline" x1="0" y1="36" x2="680" y2="36"/>
    </g>

    <g id="body" class="mono boot" font-size="17">
      <!-- —— Prompt phase: type vim FOCUS.md —— -->
      <g class="prompt-phase">
        <text font-size="17" x="28" y="68">
          <tspan class="muted">brandon@github</tspan>
          <tspan class="dim" dx="10">~/profile</tspan>
        </text>

        <text x="28" y="104">
          <tspan class="prompt">$</tspan>
        </text>
        <g class="cmd-text">
          <text class="fg" x="52" y="104">vim FOCUS.md</text>
        </g>
        <rect class="cmd-cursor" x="52" y="90" width="9" height="18" rx="1"/>
      </g>

      <!-- —— Editor phase: insert mode with line numbers —— -->
      <g class="editor-phase">
        <!-- Gutter -->
        <rect x="0" y="36" width="48" height="232" fill="#0c0c0c" opacity="0.55"/>
        <line class="gutter-rule" x1="48" y1="44" x2="48" y2="260"/>

        <!-- Gutter numbers: fixed 28px row pitch, centered in gutter -->
        <g class="gutter-nums dim" font-size="17" text-anchor="middle">
          <text x="28" y="68">1</text>
          <text x="28" y="96">2</text>
          <text x="28" y="124">3</text>
          <text x="28" y="152">4</text>
          <text x="28" y="180">5</text>
        </g>

        <!-- Typed lines (blank rows 2 &amp; 4 = Enter Enter padding) -->
        <g class="line-text l1-text">
          <text class="fg" x="58" y="68">- Building privacy-focused mobile apps (Swift &amp; Expo)</text>
        </g>
        <g class="line-text l2-text">
          <text class="fg" x="58" y="124">- Exploring agentic engineering, LLM tooling &amp; local AI</text>
        </g>
        <g class="line-text l3-text">
          <text class="fg" x="58" y="180">- Strengthening security posture &amp; personal privacy</text>
        </g>

        <!-- Insert caret (origin at line 1 start) -->
        <rect class="edit-cursor" x="58" y="54" width="9" height="18" rx="1"/>

        <!-- Vim status line -->
        <rect class="status-bar" x="0" y="268" width="680" height="28"/>
        <line class="hairline" x1="0" y1="268" x2="680" y2="268"/>
        <text class="mono" font-size="13" y="286">
          <tspan class="bright" x="20">-- INSERT --</tspan>
          <tspan class="dim" x="560">FOCUS.md</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
